title: SM Software Provisioning Service Folder Creation
id: 4e7b1c56-a8d9-4f0e-d125-5a6b7c8d9e0f
status: experimental
description: >
    Detects file creation or process execution in the SM Software Provisioning
    Service directory under AppData, which is created by the malicious MSI
    bundle in CVE-2026-110936 exploitation.
references:
    - https://productcert.siemens.com/news/2026/10/19/active-exploitation-of-cve-2026-110936-in-siemens-software-center/
author: Actioner CTI
date: 2026-10-20
tags:
    - attack.defense-evasion
    - attack.t1574.002
    - cve.2026-110936
logsource:
    category: file_event
    product: windows
detection:
    selection:
        TargetFilename|contains: '\AppData\Local\Programs\SM Software Provisioning Service\'
    condition: selection
falsepositives:
    - Unknown; this folder name is specific to the malicious campaign
level: high
