title: MemTensor sckit GitHub Actions CI Poisoning Indicators
id: c9cdd6c5-bedd-4f60-9117-03a6ddcf00a0
# audit: detects sckit-specific log strings and script names in process creation. High confidence — strings are unique to the campaign.
status: experimental
description: >
  Detects command-line indicators of MemTensor sckit worm activity in CI/CD environments,
  including the malicious publish bridge scripts and CI observation log markers used by
  the implant to propagate through GitHub Actions workflows.
references:
  - https://safedep.io/memtensor-sckit-worm-npm-pypi/
  - https://semgrep.dev/blog/2026/the-ai-ecosystem-has-worms-now-inside-the-memtensor-compromise/
author: Actioner
date: 2026/09/29
tags:
  - attack.t1195.002
  - attack.t1059.004
logsource:
  category: process_creation
  product: linux
detection:
  selection_scripts:
    CommandLine|contains:
      - 'sckit-publish-bridge.sh'
      - '_pypi_bridge.sh'
      - '_initial_ci_delivery.py'
      - 'sckit_poetry_build.py'
      - 'runtime-update.yml'
  selection_log_markers:
    CommandLine|contains:
      - 'SCKIT_CI_RESULT_V2'
      - 'SCKIT_CI_OBSERVATION_V2'
      - 'SCKit credential receipt acknowledged'
  condition: selection_scripts or selection_log_markers
falsepositives:
  - Unlikely; script names and log strings are unique to the sckit worm campaign
level: critical
