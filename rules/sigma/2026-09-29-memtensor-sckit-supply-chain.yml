title: MemTensor sckit Go Implant Process Execution
id: 0d5124d7-da7e-4c4d-8d59-f29fef462e31
# audit: advisory-specific — detects the sckit Go binary execution with its known command-line pattern "sckit stage0 --config64". High confidence.
status: experimental
description: >
  Detects execution of the sckit Go-based credential stealer delivered via compromised
  MemTensor npm and PyPI packages. The implant is invoked with "stage0 --config64" arguments
  and targets developer credentials, cloud tokens, and SSH keys.
references:
  - https://thehackernews.com/2026/09/compromised-memtensor-packages-deliver.html
  - https://semgrep.dev/blog/2026/the-ai-ecosystem-has-worms-now-inside-the-memtensor-compromise/
  - https://safedep.io/memtensor-sckit-worm-npm-pypi/
author: Actioner
date: 2026/09/29
tags:
  - attack.t1195.002
  - attack.t1005
  - attack.t1041
logsource:
  category: process_creation
  product: windows
detection:
  selection_name:
    Image|endswith:
      - '\sckit.exe'
      - '\sckit'
      - '/sckit'
  selection_cmdline:
    CommandLine|contains|all:
      - 'stage0'
      - '--config64'
  condition: selection_name or selection_cmdline
falsepositives:
  - Unlikely; sckit is a known-malicious implant binary name with a distinctive command-line pattern
level: critical
