title: MemTensor sckit Credential File Access
id: b8ce2803-cd96-44ae-8bfb-72b6876df7e8
# audit: behavioral — detects access to credential files known to be targeted by sckit. Lower confidence due to potential legitimate access.
status: experimental
description: >
  Detects access to credential and token files targeted by the MemTensor sckit
  implant, including .npmrc, .pypirc, .vault-token, and SSH private keys, by
  processes that are not expected credential consumers.
references:
  - https://thehackernews.com/2026/09/compromised-memtensor-packages-deliver.html
  - https://safedep.io/memtensor-sckit-worm-npm-pypi/
author: Actioner
date: 2026/09/29
tags:
  - attack.t1555
  - attack.t1005
logsource:
  category: file_access
  product: windows
detection:
  selection_cred_files:
    TargetFilename|endswith:
      - '\.npmrc'
      - '\.pypirc'
      - '\.vault-token'
      - '\.git-credentials'
      - '\.netrc'
      - '\id_ecdsa'
      - '\id_ed25519'
      - '\id_rsa'
      - '\access_tokens.json'
      - '\access_tokens.db'
      - '\credentials.db'
      - '\msal_token_cache'
  filter_expected:
    Image|endswith:
      - '\git.exe'
      - '\ssh.exe'
      - '\ssh-agent.exe'
      - '\npm.cmd'
      - '\npm.exe'
      - '\pip.exe'
      - '\vault.exe'
      - '\code.exe'
  condition: selection_cred_files and not filter_expected
falsepositives:
  - Legitimate developer tools or CI/CD agents accessing credential files
  - Credential management utilities
level: medium
