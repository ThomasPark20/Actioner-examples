title: MemTensor Malicious Package File Artifacts
id: c49cc649-40b7-4f46-9d0c-d561f773de42
# audit: detects file writes to sckit staging directories under .openclaw/.cache/runtime or .memos/.cache/runtime. Medium-high confidence.
status: experimental
description: >
  Detects creation of files in directories used by the MemTensor sckit implant
  for staging and caching its Go binary payload. The implant writes to
  .openclaw/.cache/runtime/ and .memos/.cache/runtime/ under the user home directory.
references:
  - https://thehackernews.com/2026/09/compromised-memtensor-packages-deliver.html
  - https://semgrep.dev/blog/2026/the-ai-ecosystem-has-worms-now-inside-the-memtensor-compromise/
  - https://safedep.io/memtensor-sckit-worm-npm-pypi/
author: Actioner
date: 2026/09/29
tags:
  - attack.t1195.002
  - attack.t1105
logsource:
  category: file_event
  product: windows
detection:
  selection_openclaw:
    TargetFilename|contains: '.openclaw\.cache\runtime'
  selection_memos:
    TargetFilename|contains: '.memos\.cache\runtime'
  selection_sckit_dir:
    TargetFilename|contains: '.sckit\'
  condition: selection_openclaw or selection_memos or selection_sckit_dir
falsepositives:
  - Legitimate MemTensor OpenClaw plugin usage may create the .openclaw directory, but .cache/runtime subdirectory is specific to the malicious payload
level: high
