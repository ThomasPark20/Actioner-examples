title: PHP2Shell - Suspicious Multipart POST with Known Attacker Tool Markers
id: c3d4e5f6-a7b8-9012-cdef-123456789012
status: experimental
description: >
    Detects HTTP POST requests containing PHP_SESSION_UPLOAD_PROGRESS with
    known attacker tool markers (ShellFlow, Neo Scanner) in the request body,
    indicating PHP2Shell (CVE-2026-109618/109619) exploitation attempts.
references:
    - https://www.zscaler.com/blogs/security-research/cve-2026-109618-and-cve-2026-109619-php-vulnerable-unauthenticated-rce
    - https://www.sophos.com/en-us/security-advisories/sophos-sa-20261021-php2shell
author: CTI Analyst
date: 2026-11-01
tags:
    - attack.t1190
    - cve.2026-109618
    - cve.2026-109619
logsource:
    category: webserver
detection:
    selection_method:
        cs-method: 'POST'
    selection_indicators:
        cs-uri|endswith:
            - '.php'
            - '/'
    selection_body:
        request_body|contains:
            - 'PHP_SESSION_UPLOAD_PROGRESS'
    selection_tool_markers:
        request_body|contains:
            - 'shellflow_poc'
            - 'neo_obj_inject'
            - 'shellflow-php2shell'
            - 'NeoMM2026'
    condition: selection_method and selection_indicators and selection_body and selection_tool_markers
falsepositives:
    - Legitimate PHP applications using session upload progress tracking (unlikely combined with these specific tool markers)
level: high
