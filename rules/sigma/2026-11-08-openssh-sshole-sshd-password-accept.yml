title: OpenSSH SSHole - Password Authentication Accepted for Passwordless Account
id: 7a3c1e2d-9f4b-4d8a-b6e5-1c2d3e4f5a6b
status: experimental
description: >
    Detects sshd accepting a password-based login for accounts that should not accept passwords,
    indicating possible exploitation of CVE-2026-123158 (SSHole). On musl-based systems without PAM,
    accounts with a '*' password field (root, key-only users, alpine) can be logged into with a
    257-1024 byte password due to a crypt() return value collision.
references:
    - https://sshhole.com
    - https://alpinelinux.org/posts/2026-11-05-openssh-password-authentication-bypass/
    - https://thehackernews.com/2026/11/hackers-exploited-openssh-sshole-flaw.html
author: Actioner
date: 2026/11/08
tags:
    - attack.t1078.001
logsource:
    product: linux
    service: syslog
detection:
    selection_root:
        SyslogMessage|contains: 'Accepted password for root '
    selection_alpine:
        SyslogMessage|contains: 'Accepted password for alpine '
    selection_nobody:
        SyslogMessage|contains: 'Accepted password for nobody '
    selection_daemon:
        SyslogMessage|contains: 'Accepted password for daemon '
    selection_bin:
        SyslogMessage|contains: 'Accepted password for bin '
    condition: 1 of selection_*
falsepositives:
    - Systems where root or other listed accounts have a real password configured (not Alpine default)
    - Non-musl systems where these accounts legitimately accept password logins
level: medium
