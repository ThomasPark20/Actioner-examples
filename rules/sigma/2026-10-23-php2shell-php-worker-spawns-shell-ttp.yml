title: PHP Worker Process Spawning Shell or Download Tool (TTP)
id: 9d4e7f2a-1b3c-4a8d-b5e6-0c9f8a7d6e3b
status: experimental
description: >
    Behavioral (TTP) rule, not PHP2Shell-specific. Detects a PHP-FPM, CGI,
    LiteSpeed, FrankenPHP or Apache (mod_php) worker spawning a shell,
    interpreter or download tool, the generic post-exploitation signal after
    web-worker RCE such as CVE-2026-109618 / CVE-2026-109619. Scope to PHP
    server hosts and baseline first.
references:
    - https://blog.talosintelligence.com/two-critical-rces-in-php-core/
    - https://securitylabs.datadoghq.com/articles/php2shell-critical-vulnerabilities-in-php/
    - https://watchtowr.com/intelligence/php-remote-code-execution-php2shell/
author: Actioner
date: 2026/10/23
tags:
    - attack.execution
    - attack.initial-access
    - attack.t1059.004
    - attack.t1190
logsource:
    category: process_creation
    product: linux
detection:
    selection_parent:
        ParentImage|contains:
            - '/php-fpm'
            - '/php-cgi'
            - '/lsphp'
            - '/frankenphp'
        # versioned binaries (e.g. /usr/sbin/php-fpm8.3) matched by contains
    selection_parent_apache:
        ParentImage|endswith:
            - '/apache2'
            - '/httpd'
    selection_child:
        Image|endswith:
            - '/sh'
            - '/bash'
            - '/dash'
            - '/zsh'
            - '/python'
            - '/python3'
            - '/perl'
            - '/curl'
            - '/wget'
    filter_sendmail:
        CommandLine|contains: 'sendmail'
    condition: (selection_parent or selection_parent_apache) and selection_child and not filter_sendmail
falsepositives:
    - PHP applications that call exec()/system()/mail() (image processing, mail via sh -c sendmail, maintenance helpers)
    - Apache CGI scripts that legitimately run shells
level: medium
