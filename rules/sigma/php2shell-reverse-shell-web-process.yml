title: Reverse Shell Indicators from Web Server Process
id: e5f6a7b8-c9d0-1234-efab-345678901234
status: experimental
description: >
    Detects reverse shell patterns in command lines of processes spawned by
    PHP or web server workers. This is a behavioral TTP companion rule, not
    specific to any single vulnerability.
references:
    - https://unit42.paloaltonetworks.com/cve-2026-109618-cve-2026-109619/
    - https://www.huntress.com/blog/php2shell-leaked-critical-php-vulnerabilities
author: CTI Analyst
date: 2026-11-01
tags:
    - attack.t1059.004
    - attack.t1071.001
logsource:
    category: process_creation
    product: linux
detection:
    selection_parent:
        ParentImage|endswith:
            - '/php-fpm'
            - '/php-cgi'
            - '/php'
            - '/httpd'
            - '/apache2'
            - '/lsphp'
            - '/litespeed'
    selection_revshell:
        CommandLine|contains:
            - '/dev/tcp/'
            - 'mkfifo'
            - 'nc -e'
            - 'ncat -e'
            - 'socat exec'
            - 'bash -i >&'
            - "python -c 'import socket"
            - "python3 -c 'import socket"
            - "php -r '$sock=fsockopen"
            - 'perl -e'
            - 'fsockopen'
    condition: selection_parent and selection_revshell
falsepositives:
    - Very unlikely in production web server environments
level: high
