title: WeaselBiscuit Chrome Extension Storage Access by Node.js
id: 2f7d9e4a-6c31-48b5-a0e2-9d8f3b5c1a47
# audit: TTP/behavioral rule — node accessing Chrome extension LevelDB is suspicious but not unique to WeaselBiscuit; medium confidence.
# audit: Requires Sysmon (EventID 11 or file access auditing) or equivalent EDR telemetry with file_access logging on Windows.
status: experimental
description: >
  Detects Node.js processes accessing Chrome Local Extension Settings LevelDB
  directories, a behavior associated with the WeaselBiscuit stealer that harvests
  extension storage data across Windows, macOS, and Linux.
references:
  - https://thehackernews.com/2026/09/weaselbiscuit-stealer-spreads-via-13.html
  - https://opensourcemalware.com/blog/introducing-weaselbiscuit
author: Actioner
date: 2026/09/20
tags:
  - attack.t1005
  - attack.t1217
logsource:
  category: file_access
  product: windows
detection:
  selection_process:
    Image|endswith:
      - '\node.exe'
      - '\node'
  selection_path:
    TargetFilename|contains: '\Local Extension Settings\'
  condition: selection_process and selection_path
falsepositives:
  - Legitimate browser extension development tools or testing frameworks that read LevelDB stores
level: medium
