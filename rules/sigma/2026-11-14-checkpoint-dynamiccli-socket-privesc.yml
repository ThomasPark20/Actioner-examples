title: DynamicCLI Socket Privilege Escalation Attempt (CVE-2026-123039)
id: d4e5f6a7-b8c9-0123-defa-234567890123
status: experimental
description: Detects suspicious access to the DynamicCLI Unix socket (/tmp/dynamic_socket) and processes bypassing the Clish wrapper, indicating potential exploitation of CVE-2026-123039 for local privilege escalation to root.
references:
    - https://research.checkpoint.com/2026/php2shell-exploitation-on-check-point-gateway/
    - https://cybersecuritynews.com/check-point-0-day-vulnerability/
author: Actioner
date: 2026-11-14
tags:
    - attack.privilege_escalation
    - attack.t1068
    - cve.2026-123039
logsource:
    category: process_creation
    product: linux
detection:
    selection_socket_access:
        CommandLine|contains: '/tmp/dynamic_socket'
    condition: selection_socket_access
falsepositives:
    - Legitimate DynamicCLI operations through the Clish wrapper; investigate commands that bypass Clish
level: medium
