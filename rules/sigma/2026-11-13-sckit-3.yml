title: SCKit TrapWatch Scheduled Task Creation
id: b9e3f4a5-6c7d-8e9f-0a1b-2c3d4e5f6a7b
status: experimental
description: Detects creation of the TrapWatch scheduled task used by SCKit malware for persistence. TrapWatch runs as SYSTEM every 10 seconds to stop legitimate ScreenConnect clients and replace them with the RelayTrap component.
references:
    - https://www.huntress.com/blog/sckit-worm-rogue-screenconnect
    - https://blackpointcyber.com/blog/screenconnect-attack-sckit/
author: Actioner
date: 2026/11/13
tags:
    - attack.persistence
    - attack.t1053.005
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_schtasks:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains|all:
            - '/create'
            - 'TrapWatch'
    condition: selection_schtasks
falsepositives:
    - Legitimate software named TrapWatch is not known to exist. False positives are very unlikely.
level: critical
