title: WindowsServiceHost VBScript Persistence Via Run Key
id: e406c654-b5d8-4529-befc-46246ac02076
status: experimental
description: >
    Detects creation of a Registry Run key value named WindowsServiceHost
    pointing to a VBScript file, matching the persistence mechanism used
    by the September 2026 ScreenConnect worm campaign.
references:
    - https://www.huntress.com/blog/rogue-screenconnect-installations
    - https://thehackernews.com/2026/09/rogue-screenconnect-clients-spread-four.html
author: Actioner
date: 2026/09/08
tags:
    - attack.t1547.001
logsource:
    category: registry_set
    product: windows
detection:
    selection_key:
        TargetObject|endswith: '\Software\Microsoft\Windows\CurrentVersion\Run\WindowsServiceHost'
    selection_value:
        Details|endswith: 'WindowsServiceHost.vbs'
    condition: selection_key and selection_value
falsepositives:
    - Unknown
level: critical
---
title: ScreenConnect Worm Staging File Creation
id: 8937b675-1df3-43f8-8b40-7d7254b99460
status: experimental
description: >
    Detects creation of staging files (value.txt, map.txt, out.enc, runner.ps1)
    in the user TEMP directory by wscript.exe or cscript.exe, consistent with
    the multi-stage payload delivery observed in the September 2026
    ScreenConnect worm campaign.
references:
    - https://www.huntress.com/blog/rogue-screenconnect-installations
    - https://thehackernews.com/2026/09/rogue-screenconnect-clients-spread-four.html
author: Actioner
date: 2026/09/08
tags:
    - attack.t1059.005
    - attack.t1027
logsource:
    category: file_event
    product: windows
detection:
    selection_process:
        Image|endswith:
            - '\wscript.exe'
            - '\cscript.exe'
    selection_files:
        TargetFilename|endswith:
            - '\value.txt'
            - '\map.txt'
            - '\out.enc'
            - '\runner.ps1'
        TargetFilename|contains: '\Temp\'
    condition: selection_process and selection_files
falsepositives:
    - Generic filenames (value.txt, map.txt) may appear in unrelated VBScript automation
level: low
