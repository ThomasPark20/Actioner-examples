title: LAZYBONES Slack C2 Communication from Server
id: e5f6a7b8-c9d0-4e1f-2a3b-4c5d6e7f8a9b
status: experimental
description: Detects outbound HTTPS connections from servers to Slack API endpoints used by the LAZYBONES backdoor for command-and-control. LAZYBONES uses Slack channels for C2 with AES-256-CTR encryption and 150-450 second jitter. This was deployed by ARMORY CASTLE during exploitation of CVE-2026-123890.
references:
    - https://cloud.google.com/blog/topics/threat-intelligence/armory-castle-exploits-vsphere
author: Actioner Research
date: 2026-11-20
tags:
    - attack.command_and_control
    - attack.t1102.002
    - cve.2026-123890
logsource:
    category: proxy
detection:
    selection_slack:
        c-uri|contains:
            - 'slack.com/api/files.getUploadURLExternal'
            - 'slack.com/api/files.completeUploadExternal'
            - 'slack.com/api/conversations.history'
    condition: selection_slack
falsepositives:
    - Legitimate Slack integrations on servers; focus on Linux infrastructure servers (vCenter, appliances) that should not be using Slack APIs directly
level: medium
