title: Cursor Sandbox Helper File Modification
id: b2e4d9f1-8c5a-4b0e-c6d2-e9f3a4b7c5d8
status: experimental
description: Detects modification or creation of the cursorsandbox helper binary, which is the key exploitation target in DuneSlide (CVE-2026-50548/CVE-2026-50549) sandbox escape attacks.
references:
    - https://www.catonetworks.com/blog/duneslide-two-critical-rce-vulnerabilities/
    - https://github.com/cursor/cursor/security/advisories/GHSA-3v8f-48vw-3mjx
author: Actioner CTI
date: 2026-07-05
tags:
    - attack.defense-evasion
    - attack.t1562.001
    - cve.2026-50548
    - cve.2026-50549
logsource:
    category: file_change
    product: windows
detection:
    selection:
        TargetFilename|endswith:
            - '\resources\helpers\cursorsandbox'
            - '\resources\helpers\cursorsandbox.exe'
        TargetFilename|contains:
            - 'Cursor'
            - 'cursor'
    condition: selection
falsepositives:
    - Legitimate Cursor IDE updates or installations
level: high
