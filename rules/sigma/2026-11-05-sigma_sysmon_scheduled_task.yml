title: Malicious Claude Code Extension - SysMon Scheduled Task Creation
id: 6e9a0c3d-4f5b-6a7c-d8e9-f0a1b2c3d4e5
status: experimental
description: Detects creation of a Windows scheduled task named SysMon used for persistence by the malicious Claude Code Cursor extension SSH backdoor.
references:
    - https://www.microsoft.com/en-us/security/blog/2026/10/30/inside-malicious-claude-code-branded-cursor-extension-persistent-ssh-backdoor/
    - https://cursor.com/blog/claude-code-extension-security-notice
author: Actioner
date: 2026/11/05
tags:
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection_schtasks:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains|all:
            - '/create'
            - '/tn'
            - 'SysMon'
    condition: selection_schtasks
falsepositives:
    - Legitimate Sysinternals Sysmon installation uses a different task name and binary path; verify the task action points to smt.cmd
level: high
