title: Suspicious Child Process Spawned by NGINX
id: 9b4e8d12-e5f3-4c2a-b6d4-7f9a0e1b3c4d
status: experimental
description: >
    Detects suspicious child processes spawned by an NGINX worker process, which may indicate
    successful post-exploitation from multiple NGINX RCE vectors including CVE-2026-123007.
    The exploit overwrites a cleanup callback pointer to redirect execution to system(),
    allowing arbitrary command execution as the NGINX worker user.
references:
    - https://www.circl.lu/pub/tr-105/
    - https://rapid7.com/blog/post/ve-cve-2026-123007-critical-nginx-http-2-integer-underflow-leads-to-rce-fixed
    - https://research.jfrog.com/post/nginx2shell-all-you-need-to-know-about-cve-2026-123007-and-cve-2026-123633/
author: Actioner Research
date: 2026-11-20
tags:
    - attack.initial_access
    - attack.t1190
    - attack.execution
    - attack.t1059
    - cve.2026.123007
logsource:
    category: process_creation
    product: linux
detection:
    selection_parent:
        ParentImage|endswith: '/nginx'
    selection_child:
        Image|endswith:
            - '/sh'
            - '/bash'
            - '/dash'
            - '/zsh'
            - '/curl'
            - '/wget'
            - '/python'
            - '/python3'
            - '/perl'
            - '/php'
            - '/ruby'
            - '/nc'
            - '/ncat'
            - '/socat'
            - '/id'
            - '/whoami'
            - '/uname'
            - '/cat'
            - '/chmod'
            - '/chown'
    filter_expected:
        CommandLine|contains:
            - 'nginx -s'
            - 'nginx -t'
    filter_nginx_binary:
        ParentImage: '/usr/sbin/nginx'
    condition: selection_parent and selection_child and not filter_expected and not filter_nginx_binary
falsepositives:
    - Custom NGINX modules that intentionally spawn helper processes
    - CGI or FastCGI configurations that execute scripts via NGINX
    - Monitoring or health-check scripts invoked by NGINX
level: medium
