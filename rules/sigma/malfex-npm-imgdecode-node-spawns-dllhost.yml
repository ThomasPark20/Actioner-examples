title: Node.js Spawns dllhost.exe Without COM Activation - MALFEX imgdecode Loader
id: 8a3c1f2e-5d7b-4e9a-b1c3-6f8e2d4a7b90
status: experimental
description: Detects node.exe spawning dllhost.exe without the typical /Processid argument, indicative of the MALFEX imgdecode native addon performing process injection into dllhost.exe without COM activation.
references:
    - https://safedep.io/malfex-imgdecode-npm-native-addon-loader/
    - https://thehackernews.com/2026/10/malfex-npm-package-imgdecode-hides.html
author: Actioner CTI
date: 2026-10-18
tags:
    - attack.t1055
    - attack.t1059.007
logsource:
    category: process_creation
    product: windows
detection:
    selection_parent:
        ParentImage|endswith: '\node.exe'
    selection_child:
        Image|endswith: '\dllhost.exe'
    filter_processid:
        CommandLine|contains: '/Processid:'
    condition: selection_parent and selection_child and not filter_processid
falsepositives:
    - Legitimate Node.js applications that spawn dllhost.exe without /Processid argument (highly unlikely)
level: critical
