title: ChainDrop C2 Domain DNS Query
id: 7a5e3c9d-1b4f-42e8-a6d0-8f2c5b7e3a1d
status: experimental
description: >
    Detects DNS queries to known ChainDrop C2 domains (npm-cache.com,
    pypi-get.com, js-mirror.com, awqhnjewqjkl.icu) used for exfiltration
    and remote code execution.
references:
    - https://unit42.paloaltonetworks.com/chaindrop-npm-worm-analysis/
author: Actioner
date: 2026/08/09
tags:
    - attack.t1071.001
    - attack.t1568
logsource:
    category: dns_query
detection:
    selection:
        QueryName|endswith:
            - 'npm-cache.com'
            - 'pypi-get.com'
            - 'js-mirror.com'
            - 'awqhnjewqjkl.icu'
    condition: selection
falsepositives:
    - Extremely unlikely given domain specificity
level: critical
