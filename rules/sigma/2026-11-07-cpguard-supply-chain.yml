title: cPGuard Supply Chain Attack - Malicious Update Script Artifacts
id: 8a1c3e7d-9f4b-4d2a-b6e1-3c5a8d7f2e90
status: experimental
description: >
    Detects artifacts associated with the cPGuard supply chain attack (November 2026)
    where attackers hijacked the update channel to deploy malicious scripts that installed
    a setuid-root backdoor shell, scheduled tasks, and exfiltrated credentials from
    approximately 2,950 Linux servers.
references:
    - https://thehackernews.com/2026/11/cpguard-update-channel-hijacked-to.html
    - https://opsshield.com/notice/cpguard-update-channel-compromise.html
    - https://opsshield.com/notice/security-incident-disclosure-servermanage.html
author: Actioner CTI
date: 2026-11-07
modified: 2026-11-07
tags:
    - attack.t1059.004
    - attack.t1053.003
    - attack.t1548.001
    - attack.t1003
    - attack.t1195.002
logsource:
    category: file_event
    product: linux
detection:
    selection_backdoor_shell:
        TargetFilename|contains:
            - '/var/tmp/.cpg91511_sh'
    selection_cron_persistence:
        TargetFilename|contains:
            - '/etc/cron.d/i93677'
    selection_staging_dir:
        TargetFilename|contains:
            - '/var/tmp/.cpg91511/'
            - '/var/tmp/.i93677/'
    selection_loot_archive:
        TargetFilename|endswith:
            - '/var/tmp/.cpg91511/loot.tgz'
    selection_gsocket_backdoor:
        TargetFilename|contains:
            - '/usr/bin/defunct'
            - '/lib/systemd/system/defunct.dat'
    selection_go_implant:
        TargetFilename|contains:
            - '/usr/sbin/pythno3'
            - '/usr/sbin/netstat.cfg'
            - '/usr/lib/system.mark'
            - '/usr/lib/libgdi.so.0.8.2'
            - '/boot/system.pub'
    selection_hiding_script:
        TargetFilename|contains:
            - '/etc/profile.d/gateway.sh'
    condition: 1 of selection_*
falsepositives:
    - Unlikely for most paths; /etc/profile.d/gateway.sh could be a legitimate network-configuration script and /usr/bin/defunct is a generic binary name - these individual paths are less distinctive than the compound selections
level: critical
