title: cPGuard Supply Chain Attack - Malicious Script Execution
id: 2b4d6e8f-1a3c-5b7d-9e0f-4c6a8b2d1e3f
status: experimental
description: >
    Detects execution of the malicious cPGuard update scripts that were distributed
    through the hijacked update channel. These scripts collect /etc/shadow, SSH keys,
    MySQL credentials, and shell history before exfiltrating them.
references:
    - https://thehackernews.com/2026/11/cpguard-update-channel-hijacked-to.html
    - https://opsshield.com/notice/security-incident-disclosure-servermanage.html
author: Actioner CTI
date: 2026-11-07
modified: 2026-11-07
tags:
    - attack.t1059.004
    - attack.t1195.002
logsource:
    category: process_creation
    product: linux
detection:
    selection_script_name:
        CommandLine|contains:
            - 'cpguard-v58812-i91511'
    selection_hidden_process_gsocket:
        Image|endswith:
            - '/usr/bin/defunct'
        CommandLine|contains:
            - 'slub_flushwq'
    selection_hidden_process_implant:
        Image|endswith:
            - '/usr/sbin/pythno3'
            - '/usr/sbin/netstat.cfg'
        CommandLine|contains:
            - 'rcu_gp'
    selection_hiding_mechanism:
        CommandLine|contains:
            - '/etc/profile.d/gateway.sh'
            - '/etc/profile.d/bash.cfg'
    condition: 1 of selection_*
falsepositives:
    - Unlikely - indicators are highly specific to this attack
level: critical
