title: cPGuard Supply Chain Attack - Credential Harvesting Behavior
id: 3c5e7f9a-2b4d-6c8e-0a1f-5d7b9c3e2f4a
status: experimental
description: >
    Detects behavioral patterns associated with the cPGuard malicious update script
    credential harvesting activity - reading /etc/shadow, SSH keys, and MySQL
    credentials in sequence, followed by archiving into a hidden /var/tmp directory.
references:
    - https://thehackernews.com/2026/11/cpguard-update-channel-hijacked-to.html
    - https://opsshield.com/notice/security-incident-disclosure-servermanage.html
author: Actioner CTI
date: 2026-11-07
modified: 2026-11-07
tags:
    - attack.t1003
    - attack.t1552.004
    - attack.t1005
logsource:
    # NOTE: file_access on Linux requires auditd (or equivalent) configured to log file-read events.
    # Most deployments do not have this out of the box. This rule is config-dependent.
    category: file_access
    product: linux
detection:
    selection_shadow:
        TargetFilename: '/etc/shadow'
    selection_ssh_keys:
        TargetFilename|contains: '/root/.ssh/'
    selection_mysql_creds:
        TargetFilename: '/root/.my.cnf'
    selection_s3_creds:
        TargetFilename: '/root/.s3cfg'
    selection_staging:
        TargetFilename|contains: '/var/tmp/.cpg91511'
    condition: selection_staging and (selection_shadow or selection_ssh_keys or selection_mysql_creds or selection_s3_creds)
falsepositives:
    - Security auditing tools that read /etc/shadow in combination with writing to /var/tmp
level: high
