title: Suspicious Symlink Creation Targeting Cursor Sandbox Helper
id: c3f5e0a2-9d6b-4c1f-d7e3-f0a4b5c8d6e9
status: experimental
description: Detects creation of symbolic links that may target the cursorsandbox helper binary, indicative of CVE-2026-50549 symlink-based sandbox escape.
references:
    - https://www.catonetworks.com/blog/duneslide-two-critical-rce-vulnerabilities/
    - https://github.com/cursor/cursor/security/advisories/GHSA-3v8f-48vw-3mjx
author: Actioner CTI
date: 2026-07-05
tags:
    - attack.defense-evasion
    - attack.t1036
    - cve.2026-50549
logsource:
    category: process_creation
    product: windows
detection:
    selection_mklink:
        Image|endswith:
            - '\cmd.exe'
        CommandLine|contains|all:
            - 'mklink'
            - 'cursorsandbox'
    selection_ln_powershell:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains|all:
            - 'New-Item'
            - 'SymbolicLink'
            - 'cursorsandbox'
    condition: selection_mklink or selection_ln_powershell
falsepositives:
    - Administrative troubleshooting of Cursor IDE installation
level: high
