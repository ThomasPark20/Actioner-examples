title: Suspicious Process Spawned by PHP or Web Server Worker
id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
status: experimental
description: >
    Detects suspicious child processes (shells, interpreters, download tools,
    recon utilities) spawned by PHP or web server worker processes, indicative
    of post-exploitation activity. This is a behavioral TTP companion rule,
    not specific to any single vulnerability.
references:
    - https://unit42.paloaltonetworks.com/cve-2026-109618-cve-2026-109619/
    - https://www.huntress.com/blog/php2shell-leaked-critical-php-vulnerabilities
    - https://www.zscaler.com/blogs/security-research/cve-2026-109618-and-cve-2026-109619-php-vulnerable-unauthenticated-rce
author: CTI Analyst
date: 2026-11-01
tags:
    - attack.t1190
    - attack.t1059.004
logsource:
    category: process_creation
    product: linux
detection:
    selection_parent:
        ParentImage|endswith:
            - '/php-fpm'
            - '/php-cgi'
            - '/php'
            - '/lsphp'
            - '/litespeed'
            - '/httpd'
            - '/apache2'
    selection_child:
        Image|endswith:
            - '/sh'
            - '/bash'
            - '/dash'
            - '/zsh'
            - '/python'
            - '/python3'
            - '/perl'
            - '/curl'
            - '/wget'
            - '/nc'
            - '/ncat'
            - '/socat'
            - '/id'
            - '/whoami'
            - '/uname'
    condition: selection_parent and selection_child
falsepositives:
    - Legitimate PHP applications that spawn system commands
    - CMS cron jobs or maintenance scripts
    - Monitoring plugins that execute system commands
level: medium
