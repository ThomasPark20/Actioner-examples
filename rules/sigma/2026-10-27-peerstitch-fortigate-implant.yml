        dst_ip:
            - '45.32.41.202'
            - '198.199.122.22'
            - '23.240.77.233'
            - '47.18.167.159'
            - '104.238.141.143'
            - '158.247.199.37'
            - '195.85.114.78'
            - '45.32.63.2'
            - '80.66.196.199'
            - '142.93.177.233'
            - '172.232.167.68'
