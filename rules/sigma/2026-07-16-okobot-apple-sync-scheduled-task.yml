title: OkoBot Apple Sync Scheduled Task for SSH Tunnel Persistence
id: 5c7e2a1d-8f3b-4d9e-a6c0-3b2e1f4d5c6a
status: experimental
description: >
    Detects creation of a scheduled task named "Apple Sync" used by OkoBot
    to maintain hourly reverse SSH tunnels for persistent RDP access to
    compromised endpoints.
references:
    - https://securelist.com/okobot-framework-targets-cryptocurrency-wallets/120660/
    - https://thehackernews.com/2026/07/okobot-malware-framework-injects-seed.html
author: Actioner
date: 2026/07/16
tags:
    - attack.t1053.005
    - attack.t1021.004
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\schtasks.exe'
        CommandLine|contains|all:
            - 'Apple Sync'
            - '/create'
    condition: selection
falsepositives:
    - Legitimate Apple software creating a scheduled task with this exact name is unlikely on Windows
level: high
