title: Web Worker Process Spawning Reverse Shell
id: 9c5d3e6f-7a8b-4c0d-1e2f-3a4b5c6d7e8f
status: experimental
description: >
    Detects PHP or web server worker processes spawning shells with command
    lines containing patterns consistent with reverse shell construction.
    This is a strong post-exploitation indicator following web application
    RCE exploitation.
references:
    - https://unit42.paloaltonetworks.com/cve-2026-109618-cve-2026-109619/
    - https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w
    - https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp
author: Actioner
date: 2026-10-31
tags:
    - attack.t1059.004
logsource:
    category: process_creation
    product: linux
detection:
    selection_parent:
        ParentImage|endswith:
            - '/apache2'
            - '/httpd'
            - '/php-fpm'
            - '/php-cgi'
            - '/php-fcgi'
            - '/frankenphp'
            - '/lsphp'
            - '/lshttpd'
            - '/litespeed'
            - '/sw-engine'
    selection_shell:
        Image|endswith:
            - '/bash'
            - '/sh'
            - '/dash'
            - '/zsh'
    selection_revshell:
        CommandLine|contains:
            - '/dev/tcp/'
            - 'mkfifo'
            - 'nc -e'
            - 'ncat -e'
            - 'bash -i'
            - '/dev/udp/'
    condition: selection_parent and selection_shell and selection_revshell
falsepositives:
    - Extremely unlikely in legitimate web application contexts
level: medium
