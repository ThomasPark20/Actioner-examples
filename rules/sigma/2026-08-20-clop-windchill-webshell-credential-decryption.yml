title: Clop Windchill Web Shell Credential Decryption Activity
id: c9e4a1f6-5d3b-6a0c-bf7e-8b2a4c3d5e6f
status: experimental
description: >
    Detects file access to ieStructProperties.txt or process activity referencing
    WTKeyStoreUtil.decryptProperty, indicators of the credential decryption
    capability in the Clop custom Windchill web shell. The S command in this web
    shell reads ieStructProperties.txt, decrypts the LDAP manager password from
    the application keystore, and iterates through stored properties decrypting
    additional credentials.
references:
    - https://reliaquest.com/blog/clop-returns-with-custom-implant-in-mass-extortion-campaign
    - https://thehackernews.com/2026/08/clop-linked-windchill-web-shell.html
    - https://www.bleepingcomputer.com/news/security/clop-created-custom-web-shell-for-windchill-data-theft-attacks/
author: Actioner
date: 2026/08/20
tags:
    - attack.t1555
    - attack.t1003
logsource:
    category: file_access
    product: windows
detection:
    selection_file:
        TargetFilename|endswith: 'ieStructProperties.txt'
    selection_process:
        Image|endswith:
            - '\java.exe'
            - '\javaw.exe'
    condition: selection_file and selection_process
falsepositives:
    - Legitimate Windchill application accessing its own configuration during normal startup or operation
level: medium
