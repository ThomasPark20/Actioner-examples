title: Clop Windchill Web Shell Credential Decryption Activity (Hunt Query)
id: c9e4a1f6-5d3b-6a0c-bf7e-8b2a4c3d5e6f
status: experimental
description: >
    Hunt query / correlation-only rule. Detects file access to
    ieStructProperties.txt by a Java process, which may indicate the credential
    decryption capability (S command) of the Clop custom Windchill web shell.
    However, Windchill's own Java process reads ieStructProperties.txt during
    normal startup and configuration reload, so this rule will fire on routine
    application behavior. Use only in correlation with other Clop Windchill
    indicators (web shell file creation, flst.txt output, C2 IP communication).
    Note: this rule covers Windows process paths only; Windchill commonly runs on
    Linux, where Image paths differ.
references:
    - https://reliaquest.com/blog/clop-returns-with-custom-implant-in-mass-extortion-campaign
    - https://thehackernews.com/2026/08/clop-linked-windchill-web-shell.html
    - https://www.bleepingcomputer.com/news/security/clop-created-custom-web-shell-for-windchill-data-theft-attacks/
author: Actioner
date: 2026/08/20
tags:
    - attack.t1555
logsource:
    category: file_access
    product: windows
detection:
    selection_file:
        TargetFilename|endswith: 'ieStructProperties.txt'
    selection_process:
        Image|endswith:
            - '\java.exe'
            - '\javaw.exe'
    condition: selection_file and selection_process
falsepositives:
    - Legitimate Windchill application accessing its own configuration during normal startup, configuration reload, or scheduled maintenance
level: low
