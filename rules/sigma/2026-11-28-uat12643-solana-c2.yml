title: UAT-12643 Good Game Stealer - DisableTaskMgr Tampering
id: ad2b0fea-cb1e-dab3-eaf9-cfea0b1c2d3a
status: experimental
description: >
    Detects registry modification to set DisableTaskMgr to 1, a technique used by
    the UAT-12643 Good Game stealer to prevent the victim from terminating malicious
    processes during data exfiltration. The stealer resets the value to 0 after
    completing its theft operations.
references:
    - https://blog.talosintelligence.com/uat-12643-suspected-north-korea-aligned-actor-blends-blockchain-resilience-with-targeted-infostealing/
author: Actioner
date: 2026/11/28
tags:
    - attack.defense_evasion
    - attack.t1562.001
    - attack.t1112
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|endswith: '\Policies\System\DisableTaskMgr'
        Details: 'DWORD (0x00000001)'
    condition: selection
falsepositives:
    - Group Policy enforcement disabling Task Manager in kiosk or restricted environments
level: high
