title: UAT-12643 Overlord RAT - Anti-Analysis Sandbox DLL Checks
id: fc1a9edf-ba0d-cfa2-def8-bedffa0b9daf
status: experimental
description: >
    Detects image loads of sandbox and analysis tool DLLs that the Overlord RAT
    checks for during anti-analysis. The RAT queries for sbiedll.dll (Sandboxie),
    api_log.dll, vmcheck.dll, wpespy.dll (WPE Pro), cmdvrt64.dll (Comodo),
    avghookx.dll (AVG), snxhk.dll (Avast), and guard32.dll (Comodo).
references:
    - https://blog.talosintelligence.com/uat-12643-suspected-north-korea-aligned-actor-blends-blockchain-resilience-with-targeted-infostealing/
author: Actioner
date: 2026/11/28
tags:
    - attack.defense_evasion
    - attack.t1497.001
    - attack.t1480
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains:
            - 'sbiedll.dll'
            - 'api_log.dll'
            - 'vmcheck.dll'
            - 'wpespy.dll'
            - 'cmdvrt64.dll'
            - 'avghookx.dll'
            - 'snxhk.dll'
            - 'guard32.dll'
    condition: selection
falsepositives:
    - Security researchers testing sandbox detection mechanisms
    - Other malware families using similar sandbox evasion techniques
level: medium
