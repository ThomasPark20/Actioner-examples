title: UAT-12643 - Solana RPC Queries for C2 Resolution
id: eb0f8dce-af9c-bef1-cde7-adceefab8c9f
status: experimental
description: >
    Detects outbound HTTP requests containing Solana JSON-RPC method calls
    (getSignaturesForAddress, getTransaction) used by UAT-12643 to resolve
    C2 server addresses from encrypted Solana blockchain transaction memos.
    This technique (T1102) provides bulletproof C2 infrastructure resilience.
references:
    - https://blog.talosintelligence.com/uat-12643-suspected-north-korea-aligned-actor-blends-blockchain-resilience-with-targeted-infostealing/
    - https://blog.talosintelligence.com/the-challenge-of-defending-against-bulletproof-dead-drops-on-public-blockchains/
author: Actioner
date: 2026/11/28
tags:
    - attack.command_and_control
    - attack.t1102
    - attack.t1071.001
logsource:
    category: proxy
detection:
    selection_method:
        c-method: 'POST'
    selection_body:
        cs-body|contains:
            - 'getSignaturesForAddress'
            - 'getTransaction'
    selection_solana_endpoints:
        c-uri|contains:
            - 'solana'
            - 'mainnet'
            - 'helius'
            - 'quicknode'
            - 'tatum'
    condition: selection_method and selection_body and selection_solana_endpoints
falsepositives:
    - Legitimate Solana blockchain applications, DeFi platforms, or development tools
    - Cryptocurrency wallet software performing blockchain queries
level: medium
