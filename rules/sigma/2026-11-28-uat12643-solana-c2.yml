title: UAT-12643 - HTA Stager Drops Executable to Temp
id: 9c5a3e7f-ba4d-6fab-d8a2-5e7f9cba3d4a
status: experimental
description: >
    Detects mshta.exe spawning processes that write executables to the TEMP directory,
    consistent with the UAT-12643 HTA stager that uses MSXML2.ServerXMLHTTP to download
    and ADODB.Stream to write a payload as %TEMP%\s.exe before executing it.
references:
    - https://blog.talosintelligence.com/uat-12643-suspected-north-korea-aligned-actor-blends-blockchain-resilience-with-targeted-infostealing/
author: Actioner
date: 2026/11/28
tags:
    - attack.execution
    - attack.t1218.005
    - attack.t1105
logsource:
    category: process_creation
    product: windows
detection:
    selection_parent:
        ParentImage|endswith: '\mshta.exe'
    selection_child:
        Image|endswith:
            - '\s.exe'
            - '\cmd.exe'
            - '\powershell.exe'
    selection_temp:
        CommandLine|contains: '\Temp\'
    condition: selection_parent and (selection_child or selection_temp)
falsepositives:
    - Legitimate HTA applications spawning processes from TEMP
level: high
