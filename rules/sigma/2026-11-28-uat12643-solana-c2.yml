title: UAT-12643 Overlord RAT - WinRE OEM Persistence
id: cf8d6bac-ed7a-9cde-abc5-8baccedf6a7d
status: experimental
description: >
    Detects file creation in the Recovery\OEM directory or modification of ResetConfig.xml,
    used by the Overlord RAT for WinRE-based persistence. The RAT writes a .bat launcher
    with a random 20-character filename to %TARGETOSDRIVE%\Recovery\OEM\ and patches
    ResetConfig.xml to execute it during Windows recovery.
references:
    - https://blog.talosintelligence.com/uat-12643-suspected-north-korea-aligned-actor-blends-blockchain-resilience-with-targeted-infostealing/
author: Actioner
date: 2026/11/28
tags:
    - attack.persistence
    - attack.t1542
    - attack.defense_evasion
logsource:
    category: file_event
    product: windows
detection:
    selection_oem:
        TargetFilename|contains: '\Recovery\OEM\'
        TargetFilename|endswith: '.bat'
    selection_resetconfig:
        TargetFilename|endswith: '\ResetConfig.xml'
    condition: selection_oem or selection_resetconfig
falsepositives:
    - OEM system recovery configuration changes during OS provisioning
    - Legitimate IT deployment tools modifying WinRE configuration
level: high
---
title: UAT-12643 - Certutil URL Cache Download with Double Extension
id: da9e7cbd-fe8b-ade0-bcd6-9cbddefa7b8e
status: experimental
description: >
    Detects certutil.exe used with -urlcache -f flags to download files, a technique
    used by UAT-12643 LNK files to fetch payloads. The campaign uses double-extension
    filenames and Edge PDF icons to masquerade downloads as documents.
references:
    - https://blog.talosintelligence.com/uat-12643-suspected-north-korea-aligned-actor-blends-blockchain-resilience-with-targeted-infostealing/
author: Actioner
date: 2026/11/28
tags:
    - attack.defense_evasion
    - attack.t1218
    - attack.t1105
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\certutil.exe'
        CommandLine|contains|all:
            - '-urlcache'
            - '-f'
            - 'http'
    condition: selection
falsepositives:
    - Legitimate certificate management operations using certutil with URL cache
level: high
