title: UAT-12643 Overlord RAT - MpCmdRun Abuse for Payload Download
id: 7a3e1c5d-9f2b-4d8a-b6e0-3c5d7a9f1b2e
status: experimental
description: >
    Detects MpCmdRun.exe being abused with the -DownloadFile flag to download payloads,
    a technique used by UAT-12643 to fetch the Overlord RAT binary (saved as RuntimeBroker.exe).
    This is a known LOLBIN abuse pattern for initial access.
references:
    - https://blog.talosintelligence.com/uat-12643-suspected-north-korea-aligned-actor-blends-blockchain-resilience-with-targeted-infostealing/
    - https://github.com/Cisco-Talos/IOCs/tree/main/2026/11
author: Actioner
date: 2026/11/28
tags:
    - attack.defense_evasion
    - attack.t1218
    - attack.t1105
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\MpCmdRun.exe'
        CommandLine|contains: '-DownloadFile'
    condition: selection
falsepositives:
    - Legitimate use of MpCmdRun.exe for downloading definition updates (review context)
level: high
---
title: UAT-12643 - MSBuild Inline Task Execution of dl.xml
id: 8b4f2d6e-af3c-5e9b-c7f1-4d6e8baf2c3f
status: experimental
description: >
    Detects msbuild.exe executing XML project files with inline C# CodeTaskFactory,
    as used by UAT-12643 to execute in-memory download stagers (dl.xml). The MSBuild
    stager uses a spoofed BITS User-Agent to fetch payloads.
references:
    - https://blog.talosintelligence.com/uat-12643-suspected-north-korea-aligned-actor-blends-blockchain-resilience-with-targeted-infostealing/
author: Actioner
date: 2026/11/28
tags:
    - attack.defense_evasion
    - attack.t1127.001
    - attack.execution
    - attack.t1059.003
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\MSBuild.exe'
        CommandLine|endswith: '.xml'
    condition: selection
falsepositives:
    - Legitimate MSBuild project compilation using XML files
level: medium
