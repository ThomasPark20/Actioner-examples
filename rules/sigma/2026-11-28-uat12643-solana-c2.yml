title: UAT-12643 Clipboard Hijacker - MsgEdgeUpdate Registry Persistence
id: ad6b4f8a-cb5e-7abc-e9b3-6f8aadcb4e5b
status: experimental
description: >
    Detects the creation of a registry Run key value named MsgEdgeUpdate, used by the
    UAT-12643 clipboard hijacker for persistence. The hijacker copies itself to
    %APPDATA%\MsgEdgeUpdate.exe and registers autorun via this value.
references:
    - https://blog.talosintelligence.com/uat-12643-suspected-north-korea-aligned-actor-blends-blockchain-resilience-with-targeted-infostealing/
author: Actioner
date: 2026/11/28
tags:
    - attack.persistence
    - attack.t1547.001
    - attack.t1115
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|endswith: '\CurrentVersion\Run\MsgEdgeUpdate'
    condition: selection
falsepositives:
    - Unlikely; MsgEdgeUpdate is not a known legitimate application name
level: high
