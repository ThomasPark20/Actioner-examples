title: Check Point CPM ReflectionUtils Path Traversal Error (CVE-2026-93616)
id: 3a7e9c1d-5f2b-4e8a-b6d4-9c1f3e5a7b2d
status: experimental
description: >
    Detects ReflectionUtils errors containing directory traversal sequences (../)
    in Check Point management logs (cpm.elg), a vendor-documented indicator of
    exploitation attempts targeting CVE-2026-93616.
references:
    - https://support.checkpoint.com/results/sk/sk1000171
    - https://blog.checkpoint.com/security/security-advisory-action-required-active-exploitation-of-cve-2026-85102-and-a-management-pre-authentication-vulnerability-cve-2026-93616
    - https://www.bleepingcomputer.com/news/security/check-point-patches-management-server-zero-day-exploited-in-attacks/
author: Actioner
date: 2026/09/23
tags:
    - attack.t1190
logsource:
    product: checkpoint
    service: smartconsole
detection:
    selection_error:
        keywords:
            - 'ReflectionUtils'
    selection_traversal:
        keywords:
            - '../'
    condition: selection_error and selection_traversal
falsepositives:
    - Legitimate path resolution errors in Check Point management logs (rare)
level: high
