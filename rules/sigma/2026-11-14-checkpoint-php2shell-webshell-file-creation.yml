title: PHP2Shell Webshell File Creation on Check Point Gateway
id: c3d4e5f6-a7b8-9012-cdef-123456789012
status: experimental
description: Detects creation of PHP webshell files matching the naming pattern used in the PHP2Shell campaign (zz-prefixed .tpl files or challenge_render.tpl) and the upload staging file in /tmp.
references:
    - https://research.checkpoint.com/2026/php2shell-exploitation-on-check-point-gateway/
author: Actioner
date: 2026-11-14
tags:
    - attack.persistence
    - attack.t1505.003
logsource:
    category: file_event
    product: linux
detection:
    selection_webshell_pattern:
        TargetFilename|contains: '/zz'
        TargetFilename|endswith: '.tpl'
    selection_challenge_render:
        TargetFilename|endswith: '/challenge_render.tpl'
    selection_upload_staging:
        TargetFilename: '/tmp/.up.tpl'
    condition: selection_webshell_pattern or selection_challenge_render or selection_upload_staging
falsepositives:
    - Legitimate Check Point template updates may create .tpl files; correlate with other PHP2Shell indicators
level: high
