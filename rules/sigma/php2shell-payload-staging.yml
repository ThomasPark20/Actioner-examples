title: Payload Staging in Writable Directories from Web Process
id: f6a7b8c9-d0e1-2345-fabc-456789012345
status: experimental
description: >
    Detects file downloads or permission changes in commonly abused writable
    directories (/tmp, /var/tmp, /dev/shm) by PHP or web server processes,
    indicative of payload staging. This is a behavioral TTP companion rule.
references:
    - https://unit42.paloaltonetworks.com/cve-2026-109618-cve-2026-109619/
author: CTI Analyst
date: 2026-11-01
tags:
    - attack.t1059.004
    - attack.t1105
logsource:
    category: process_creation
    product: linux
detection:
    selection_parent:
        ParentImage|endswith:
            - '/php-fpm'
            - '/php-cgi'
            - '/php'
            - '/httpd'
            - '/apache2'
            - '/lsphp'
    selection_staging:
        CommandLine|contains:
            - 'chmod +x /tmp/'
            - 'chmod +x /var/tmp/'
            - 'chmod +x /dev/shm/'
            - 'curl -o /tmp/'
            - 'wget -O /tmp/'
            - 'curl -o /var/tmp/'
            - 'wget -O /var/tmp/'
            - 'curl -o /dev/shm/'
            - 'wget -O /dev/shm/'
    condition: selection_parent and selection_staging
falsepositives:
    - Legitimate application update or caching mechanisms
level: medium
