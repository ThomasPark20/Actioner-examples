---
title: Headless Browser Launch with Remote Debugging Port
id: 9c5a3e6d-b14f-4a0c-d7e8-f3b2a5c9d416
status: experimental
description: >
    Supplementary behavioral detection: identifies Chrome or Edge launched in headless
    mode with remote debugging enabled from a non-automation parent process. Covers the
    browser-hijacking TTP used by msaRAT and similar implants for CDP-based C2.
references:
    - https://blog.talosintelligence.com/chaos-msarat-living-off-the-browser-to-build-covert-c2-channel/
author: Actioner
date: 2026/07/26
tags:
    - attack.t1219
logsource:
    category: process_creation
    product: windows
detection:
    selection_browser:
        Image|endswith:
            - '\chrome.exe'
            - '\msedge.exe'
    selection_flags:
        CommandLine|contains|all:
            - '--headless'
            - '--remote-debugging-port'
    filter_automation_parents:
        ParentImage|endswith:
            - '\node.exe'
            - '\python.exe'
            - '\python3.exe'
            - '\java.exe'
            - '\jenkins.exe'
            - '\gitlab-runner.exe'
            - '\puppeteer.exe'
    condition: selection_browser and selection_flags and not filter_automation_parents
falsepositives:
    - Browser automation tools not covered by the parent-process filter
    - Automated testing frameworks with custom launchers
    - Web scraping utilities using direct browser invocation
level: medium
