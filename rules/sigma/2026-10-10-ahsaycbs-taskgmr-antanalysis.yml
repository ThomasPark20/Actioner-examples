title: Taskgmr.ps1 Anti-Analysis PowerShell Script
id: 4d8f2a67-1e3b-4c5d-9f7a-2b6e0d4c8a13
status: experimental
description: Detects the Taskgmr.ps1 PowerShell script that monitors Task Manager and controls the MicrosoftEdgeUpdateSvc service, as observed in AhsayCBS exploitation campaigns.
references:
    - https://www.huntress.com/blog/ahsaycbs-flaws-exploit
author: Actioner CTI
date: 2026-10-10
tags:
    - attack.defense_evasion
    - attack.t1562.001
    - attack.discovery
    - attack.t1057
logsource:
    category: process_creation
    product: windows
detection:
    selection_script_name:
        CommandLine|contains: 'Taskgmr.ps1'
    selection_script_download:
        CommandLine|contains|all:
            - 'curl'
            - 'Taskgmr.ps1'
    condition: selection_script_name or selection_script_download
falsepositives:
    - Unlikely
level: high
