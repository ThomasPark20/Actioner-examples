    - attack.t1195.001
logsource:
    category: network_connection
detection:
    selection:
        DestinationIp:
            - '23.254.165.112'
            - '23.254.167.107'
            - '23.254.167.216'
        Initiated: 'true'
    condition: selection
falsepositives:
