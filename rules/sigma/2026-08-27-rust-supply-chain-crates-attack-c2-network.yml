title: Rust Supply Chain Attack - Network Connection to Known C2 Infrastructure
id: 9d5f3b2a-1e8c-4a7d-b6e0-f2c4d9a8b7e3
status: experimental
description: >
    Detects outbound network connections to the C2 and payload delivery
