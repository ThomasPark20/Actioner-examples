---
title: UAT-12643 Overlord RAT WinRE OEM Persistence
id: b8eadf59-6ab1-7c8b-f3c6-de9f8b7ca0d4
status: experimental
description: >
    Detects modification of the Windows Recovery Environment (WinRE) OEM directory
    or ResetConfig.xml, used by UAT-12643's Overlord RAT for pre-OS boot persistence.
    The actor places a randomly-named executable and batch launcher in the
    Recovery\OEM folder and modifies ResetConfig.xml.
references:
    - https://blog.talosintelligence.com/uat-12643-suspected-north-korea-aligned-actor-blends-blockchain-resilience-with-targeted-infostealing/
author: Actioner Draft
date: 2026-11-23
tags:
    - attack.t1542
logsource:
    category: file_event
    product: windows
detection:
    selection_oem_exe:
        TargetFilename|contains: '\Recovery\OEM\'
        TargetFilename|endswith:
            - '.exe'
            - '.bat'
    selection_resetconfig:
        TargetFilename|endswith: '\ResetConfig.xml'
    condition: selection_oem_exe or selection_resetconfig
falsepositives:
    - OEM manufacturers writing legitimate recovery scripts during system provisioning
level: high
---
title: UAT-12643 Good Game Stealer Disables Task Manager During Exfiltration
id: c9fbea6a-7bc2-8d9c-a4d7-ef0a9c8db1e5
status: experimental
description: >
    Detects the DisableTaskMgr registry policy being set, which UAT-12643's Good
    Game stealer uses during data exfiltration to prevent user intervention. The
    value is set to 1 during exfiltration and reset to 0 afterward.
references:
    - https://blog.talosintelligence.com/uat-12643-suspected-north-korea-aligned-actor-blends-blockchain-resilience-with-targeted-infostealing/
author: Actioner Draft
date: 2026-11-23
tags:
    - attack.t1562.001
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|endswith: '\Policies\System\DisableTaskMgr'
        Details: 'DWORD (0x00000001)'
    condition: selection
falsepositives:
    - Group Policy or MDM configurations disabling Task Manager intentionally
level: high
---
title: UAT-12643 Solana Blockchain RPC Dead-Drop Resolver
id: d0acfb7b-8cd3-9eae-b5e8-fa1bac9ec2f6
status: experimental
description: >
    Detects processes making outbound connections to known Solana JSON-RPC endpoints
    or containing Solana RPC method names in command-line or DNS queries. UAT-12643
    Overlord RAT queries Solana transaction memos to retrieve encrypted C2 addresses.
references:
    - https://blog.talosintelligence.com/uat-12643-suspected-north-korea-aligned-actor-blends-blockchain-resilience-with-targeted-infostealing/
    - https://blog.talosintelligence.com/the-challenge-of-defending-against-bulletproof-dead-drops-on-public-blockchains/
author: Actioner Draft
date: 2026-11-23
tags:
    - attack.t1102.001
logsource:
    category: dns_query
    product: windows
detection:
    selection_solana_providers:
        QueryName|contains:
            - 'api.mainnet-beta.solana.com'
            - 'solana-mainnet.g.alchemy.com'
            - 'rpc.ankr.com/solana'
            - 'solana.quiknode.pro'
            - 'api.tatum.io'
    condition: selection_solana_providers
falsepositives:
    - Legitimate blockchain developers or Solana wallet applications
    - Cryptocurrency trading platforms
level: medium
