title: ChainDrop NPM Worm - C2 Domain DNS Resolution
id: a1bc9ec0-f88f-4936-b85d-aa72b2005485
status: experimental
description: >
    Detects DNS queries to known ChainDrop C2 domains used for command-and-control
    communication and payload delivery.
references:
    - https://unit42.paloaltonetworks.com/chaindrop-npm-worm-analysis/
    - https://www.microsoft.com/en-us/security/blog/2026/08/04/chaindrop-supply-chain-compromise-anatomy-self-propagating-worm/
author: Actioner
date: 2026-08-10
tags:
    - attack.t1071.001
    - attack.t1568
logsource:
    category: dns_query
detection:
    selection:
        QueryName|endswith:
            - 'npm-cache.com'
            - 'pypi-get.com'
            - 'js-mirror.com'
            - 'awqhnjewqjkl.icu'
    condition: selection
falsepositives:
    - None expected; these are attacker-registered domains
level: critical
