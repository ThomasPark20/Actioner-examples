title: GlassWorm Credential Staging and Persistence Artifacts
id: 4b7c9d2e-1f3a-4e6b-8c5d-7a2f3e9b1d4c
status: experimental
description: Detects file creation events associated with GlassWorm credential staging directories, persistence scripts, and throttle markers. The malware stages stolen credentials in temporary directories and creates throttle files to control re-execution intervals.
references:
    - https://opensourcemalware.com/blog/glassworm-hacks-ovh-clouds-cli-tool
    - https://checkmarx.com/zero-post/glassworm-targets-developer-ides-again-hiding-staged-malware-behind-runtime-rebuilt-loaders/
author: Actioner
date: 2026/10/21
tags:
    - attack.t1074.001
    - attack.t1547.001
logsource:
    category: file_event
    product: windows
detection:
    selection_staging_dirs:
        TargetFilename|contains:
            - '\AppData\Roaming\ozTjbCl\'
            - '\Temp\WlpSxEJPU\'
            - '\Temp\AGeZdIX\'
            - '\Temp\TvVdSR.exe'
    selection_init_json:
        TargetFilename|endswith: '\init.json'
        TargetFilename|contains: '\Users\'
    condition: selection_staging_dirs or selection_init_json
falsepositives:
    - Unlikely; these directory and file names are specific to GlassWorm malware
level: high
