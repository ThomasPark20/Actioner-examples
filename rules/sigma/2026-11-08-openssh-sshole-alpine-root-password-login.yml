title: OpenSSH SSHole - Root Password Login on Alpine Linux
id: 2b4d6e8f-1a3c-5e7d-9b0f-2c4d6e8a1b3d
status: experimental
description: >
    Detects sshd accepting a password-based login for the root account on Alpine-like systems.
    Since Alpine ships root with a '*' password field, any password-based root login is suspicious
    and may indicate exploitation of CVE-2026-123158 (SSHole) on musl-based systems.
references:
    - https://sshhole.com
    - https://alpinelinux.org/posts/2026-11-05-openssh-password-authentication-bypass/
    - https://thehackernews.com/2026/11/hackers-exploited-openssh-sshole-flaw.html
author: Actioner
date: 2026/11/08
tags:
    - attack.t1078.001
logsource:
    product: linux
    service: syslog
detection:
    selection:
        SyslogMessage|contains: 'Accepted password for root '
    condition: selection
falsepositives:
    - Systems where root has a real password configured (not Alpine default)
level: critical
