title: Siemens Software Center DLL Sideloading - Suspicious Process Execution
id: 8a3f7e91-c4d2-4b1a-9e6f-1a2b3c4d5e6f
status: experimental
description: >
    Detects SiemensSoftwareCenter.exe executed from a user-writable AppData path
    and spawned by msiexec.exe, consistent with CVE-2026-110936 exploitation
    in ClickFix-style attacks.
references:
    - https://productcert.siemens.com/productcert/html/ssa-580366.html
    - https://productcert.siemens.com/news/2026/10/19/active-exploitation-of-cve-2026-110936-in-siemens-software-center/
    - https://www.securityweek.com/siemens-software-center-vulnerability-exploited-in-clickfix-malware-attacks/
author: Actioner CTI
date: 2026-10-20
tags:
    - attack.defense-evasion
    - attack.t1574.002
    - attack.execution
    - attack.t1218.007
    - cve.2026-110936
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\SiemensSoftwareCenter.exe'
        Image|contains: '\AppData\Local\Programs\'
        ParentImage|endswith: '\msiexec.exe'
    condition: selection
falsepositives:
    - Legitimate Siemens Software Center installations via MSI in user directories, though typically installed to Program Files
level: high
