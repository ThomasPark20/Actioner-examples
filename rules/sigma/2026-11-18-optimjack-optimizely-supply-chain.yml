tags:
    - attack.t1195.002
    - attack.t1071.001
logsource:
    category: dns_query
detection:
    selection:
        QueryName|endswith:
            - '1688360.cc'
            - 'eil786npto9u5bq.icu'
            - '5vobauua3ojpklx.icu'
            - 'l7bcsnwc7nzr3uo.icu'
            - '1y69gy2mdzaltz1.icu'
            - 'gm38duxoihbmy5o.icu'
            - 'p55abnw2pnsz0bo.icu'
            - 'je4ft3gn8vxudum.icu'
            - 'q1ls1ho9x7wsxlu.icu'
            - 'ios-hack.icu'
            - 'webshell.lol'
            - 'moiubpagedocs.cc'
            - 'netvigator.cc'
            - 'k68k.xyz'
    condition: selection
falsepositives:
    - Unlikely given the specificity of these domains
level: critical
