title: Turla CerealLoader .NET Native Image Cache Abuse
id: c9e5f3f2-6b0d-4c4e-bf80-3d7c5a9b1e4f
status: experimental
description: >
    Detects suspicious file creation in the .NET native image cache directory
    with Exchange-related filenames. Turla places CerealLoader as malicious .ni.dll
    files in the NativeImages directory to hijack Exchange service DLL loading.
references:
    - https://www.welivesecurity.com/en/eset-research/exchange-for-breakfast-turlas-cereal-tricks-are-not-for-kids/
    - https://web-assets.esetstatic.com/wls/en/papers/white-papers/turla-cereal-tricks.pdf
author: CTI Analysis (DRAFT)
date: 2026-11-10
tags:
    - attack.persistence
    - attack.defense-evasion
    - attack.t1574.001
    - attack.t1036.005
logsource:
    category: file_event
    product: windows
detection:
    selection_path:
        TargetFilename|contains: '\assembly\NativeImages_v4.0.30319_64\'
    selection_name:
        TargetFilename|endswith:
            - 'Microsoft.Exchange.Search.Mdb.ni.dll'
            - 'Microsoft.Exchange.Data.Transport.ni.dll'
            - 'Microsoft.Exchange.EdgeSyncSvc.ni.exe'
            - 'EdgeTransport.ni.exe'
    filter_ngen:
        Image|endswith: '\ngen.exe'
    condition: selection_path and selection_name and not filter_ngen
falsepositives:
    - Legitimate Exchange patching or updates that regenerate native images outside of ngen.exe
level: high
---
title: Turla CerealBox Injection Into EdgeTransport Process
id: d0f6a4a3-7c1e-4d5f-ca91-4e8d6b0c2f5a
status: experimental
description: >
    Detects potential process injection into Microsoft Exchange EdgeTransport.exe.
    The Turla Cereal toolset uses CerealIron to inject CerealBox into
    EdgeTransport.exe to hijack the mail transport pipeline for email collection.
references:
    - https://www.welivesecurity.com/en/eset-research/exchange-for-breakfast-turlas-cereal-tricks-are-not-for-kids/
    - https://web-assets.esetstatic.com/wls/en/papers/white-papers/turla-cereal-tricks.pdf
author: CTI Analysis (DRAFT)
date: 2026-11-10
tags:
    - attack.defense-evasion
    - attack.t1055.001
    - attack.t1620
logsource:
    category: create_remote_thread
    product: windows
detection:
    selection:
        TargetImage|endswith: '\EdgeTransport.exe'
    filter_legitimate:
        SourceImage|endswith:
            - '\Microsoft.Exchange.Diagnostics.Service.exe'
            - '\MSExchangeTransport.exe'
    condition: selection and not filter_legitimate
falsepositives:
    - Legitimate Exchange management tools or monitoring agents
    - Exchange service restarts or updates
level: high
