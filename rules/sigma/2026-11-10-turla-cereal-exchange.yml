title: Turla CerealLoader Masquerading as Exchange Components
id: e1a7b5c4-8d2f-4e6a-dc02-5f9e7d1e3a6b
status: experimental
description: >
    Detects file creation events where known CerealLoader filenames are written
    in system directories where they are illegitimate. Turla uses filenames mimicking
    legitimate Microsoft Exchange and Windows components to disguise CerealLoader on disk.
    Note: Program Files\Microsoft\Exchange is excluded because Microsoft.Ceres.dll and
    Microsoft.Search.Platform.dll are legitimate Exchange components in that directory.
references:
    - https://www.welivesecurity.com/en/eset-research/exchange-for-breakfast-turlas-cereal-tricks-are-not-for-kids/
    - https://web-assets.esetstatic.com/wls/en/papers/white-papers/turla-cereal-tricks.pdf
author: CTI Analysis (DRAFT)
date: 2026-11-10
tags:
    - attack.defense-evasion
    - attack.t1036.005
logsource:
    category: file_event
    product: windows
detection:
    selection_exchange_masq:
        TargetFilename|endswith:
            - '\Microsoft.Ceres.dll'
            - '\Microsoft.Search.Platform.dll'
            - '\iph.dat'
    selection_system_dir:
        TargetFilename|contains:
            - '\Windows\System32\'
            - '\assembly\NativeImages'
    condition: selection_exchange_masq and selection_system_dir
falsepositives:
    - Legitimate Microsoft Exchange or Search service updates
    - Third-party software using similar naming conventions
level: medium
