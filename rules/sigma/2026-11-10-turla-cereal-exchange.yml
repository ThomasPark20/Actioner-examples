title: Turla CerealNeuron Suspicious Exchange URI Paths
id: b8d4f2e1-5a9c-4b3d-ae7f-2c6b4a8f0d3e
status: experimental
description: >
    Detects web requests to URI paths used by Turla CerealNeuron passive backdoor
    on compromised Exchange servers. CerealNeuron listens on specific URI prefixes
    that mimic legitimate Exchange services but are not standard Exchange endpoints.
references:
    - https://www.welivesecurity.com/en/eset-research/exchange-for-breakfast-turlas-cereal-tricks-are-not-for-kids/
    - https://web-assets.esetstatic.com/wls/en/papers/white-papers/turla-cereal-tricks.pdf
author: CTI Analysis (DRAFT)
date: 2026-11-10
tags:
    - attack.command-and-control
    - attack.t1071.001
    - attack.t1573.001
logsource:
    category: webserver
    product: windows
detection:
    selection:
        cs-uri-stem|contains:
            - '/owa/sdds/'
            - '/autodiscover/microsoft.exchange.proxyservice/'
            - '/autodiscover/integrated/api/'
            - '/autodiscover/proxyservice/'
            - '/microsoft-server-activesync/integrated/api/'
    condition: selection
falsepositives:
    - Legitimate Exchange traffic using similar URL patterns
    - Custom Exchange applications or plugins using these paths
level: medium
