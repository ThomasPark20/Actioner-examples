title: Turla CerealLoader DLL Search Order Hijacking in WMI Directory
id: a7c3e1d0-4f8b-4e2a-9d6c-1b5a3f7e9c2d
status: experimental
description: >
    Detects creation of suspicious DLL files (ncobjapi.dll or wbemcomn.dll) in the
    C:\Windows\System32\wbem\ directory, which is used by the Turla Cereal toolset
    for DLL search order hijacking. CerealLoader is placed in this location to be
    loaded by the legitimate WMI Provider Host process (WmiPrvSE.exe).
references:
    - https://www.welivesecurity.com/en/eset-research/exchange-for-breakfast-turlas-cereal-tricks-are-not-for-kids/
    - https://web-assets.esetstatic.com/wls/en/papers/white-papers/turla-cereal-tricks.pdf
author: CTI Analysis (DRAFT)
date: 2026-11-10
tags:
    - attack.persistence
    - attack.defense-evasion
    - attack.t1574.001
    - attack.t1036.005
logsource:
    category: file_event
    product: windows
detection:
    selection:
        TargetFilename|endswith:
            - '\Windows\System32\wbem\ncobjapi.dll'
            - '\Windows\System32\wbem\wbemcomn.dll'
    condition: selection
falsepositives:
    - Legitimate software updates placing DLLs in this directory (unlikely for these specific filenames)
level: high
