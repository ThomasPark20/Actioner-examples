title: Malicious Claude Code Extension - Persistence Script File Creation
id: 9bc3d6fa-7c8e-9d0f-a1b2-c3d4e5f6a7b8
status: experimental
description: Detects creation of hidden persistence files (.smt, .smtk, smt.cmd) in the user config directory used by the malicious Claude Code Cursor extension backdoor.
references:
    - https://www.microsoft.com/en-us/security/blog/2026/10/30/inside-malicious-claude-code-branded-cursor-extension-persistent-ssh-backdoor/
    - https://cursor.com/blog/claude-code-extension-security-notice
author: Actioner
date: 2026/11/05
tags:
    - attack.t1547.001
logsource:
    category: file_event
    product: windows
detection:
    selection_smt_files:
        TargetFilename|endswith:
            - '\.config\.smt'
            - '\.config\.smtk'
            - '\.config\smt.cmd'
    condition: selection_smt_files
falsepositives:
    - Unlikely; these hidden filenames in the config directory are distinctive to this malware
level: high
