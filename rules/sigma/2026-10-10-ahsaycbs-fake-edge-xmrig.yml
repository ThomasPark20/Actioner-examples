title: Fake Microsoft Edge Binary Used as XMRig Miner
id: 7b2e1f34-8c6d-4a9e-b5d7-3e1f0a8c2d56
status: experimental
description: Detects edge.exe or msedge.exe launched from a Temp directory or with XMRig-related command line flags, indicating a cryptominer masquerading as Microsoft Edge as seen in AhsayCBS exploitation campaigns.
references:
    - https://www.huntress.com/blog/ahsaycbs-flaws-exploit
author: Actioner CTI
date: 2026-10-10
tags:
    - attack.defense_evasion
    - attack.t1036.005
    - attack.impact
    - attack.t1496.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_temp_edge:
        Image|endswith:
            - '\edge.exe'
            - '\msedge.exe'
        Image|contains:
            - '\Temp\'
            - '\AppData\Local\Temp\'
    selection_xmrig_flags:
        Image|endswith:
            - '\edge.exe'
            - '\msedge.exe'
        CommandLine|contains:
            - '--coin'
            - '--url='
            - 'stratum+'
            - '--donate-level'
            - '-o pool'
            - 'xmrig'
            - '--daemonized'
    condition: selection_temp_edge or selection_xmrig_flags
falsepositives:
    - Unlikely - legitimate Microsoft Edge does not run from Temp directories
level: high
