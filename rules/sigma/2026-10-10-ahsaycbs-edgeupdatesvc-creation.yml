title: Malicious MicrosoftEdgeUpdateSvc Service Creation
id: 5a9b7c23-4e1d-4f6a-b8c2-9d3e5f1a7b04
status: experimental
description: Detects creation of a Windows service named MicrosoftEdgeUpdateSvc running from a Temp directory, as observed in AhsayCBS exploitation campaigns where attackers use modified NSSM to persist XMRig miners.
references:
    - https://www.huntress.com/blog/ahsaycbs-flaws-exploit
author: Actioner CTI
date: 2026-10-10
tags:
    - attack.persistence
    - attack.t1543.003
    - attack.defense_evasion
    - attack.t1036.004
logsource:
    category: process_creation
    product: windows
detection:
    selection_sc_create:
        Image|endswith: '\sc.exe'
        CommandLine|contains|all:
            - 'create'
            - 'MicrosoftEdgeUpdateSvc'
    selection_nssm_install:
        CommandLine|contains|all:
            - 'msedge.exe'
            - 'install'
            - 'MicrosoftEdgeUpdateSvc'
    condition: selection_sc_create or selection_nssm_install
falsepositives:
    - Unlikely - the legitimate Microsoft Edge update service uses a different service name
level: high
