title: Oracle PeopleSoft PSEMHUB Web Shell File Creation on Linux (CVE-2026-35273)
id: 0e35cc16-e9bf-49fc-9128-86a4fd56d913
status: experimental
description: >
    Detects creation of known web shell files in the PeopleSoft PSEMHUB.war
    directory on Linux systems, associated with UNC6240/ShinyHunters exploitation
    of CVE-2026-35273.
references:
    - https://cloud.google.com/blog/topics/threat-intelligence/shinyhunters-renewed-mass-exploitation-campaign-targeting-oracle-peoplesoft
author: Actioner CTI
date: 2026-09-27
tags:
    - attack.t1505.003
    - attack.t1190
    - cve.2026-35273
logsource:
    category: file_event
    product: linux
detection:
    selection_path:
        TargetFilename|contains: 'PSEMHUB.war'
    selection_files:
        TargetFilename|endswith:
            - '/x.jsp'
            - '/u.jsp'
            - '/u2.jsp'
            - '/tunnel.jsp'
            - '/tunnel.jspx'
            - '/Ple64.exe'
    condition: selection_path and selection_files
falsepositives:
    - Legitimate PeopleSoft administration deploying JSP files to PSEMHUB.war (rare)
level: critical
