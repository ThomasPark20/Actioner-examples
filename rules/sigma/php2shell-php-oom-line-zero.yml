title: PHP Memory Exhaustion Before Application Code (CVE-2026-109618)
id: b2c3d4e5-f6a7-8901-bcde-f12345678901
status: experimental
description: >
    Detects PHP memory exhaustion errors occurring on line 0 (before any
    application code executes), which is a key indicator of CVE-2026-109618
    exploitation via out-of-memory triggering.
references:
    - https://www.offsec.com/blog/php2shell-critical-vulnerabilities-in-php-core/
    - https://unit42.paloaltonetworks.com/cve-2026-109618-cve-2026-109619/
author: CTI Analyst
date: 2026-11-01
tags:
    - attack.t1190
    - cve.2026-109618
logsource:
    category: application
    service: php-error
detection:
    selection:
        message|contains|all:
            - 'bytes exhausted'
            - 'on line 0'
    condition: selection
falsepositives:
    - Poorly configured PHP applications with very low memory_limit hitting OOM in autoloaders
    - Legitimate large file processing operations
level: medium
