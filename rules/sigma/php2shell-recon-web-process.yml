title: Post-Exploitation Reconnaissance via Web Server Process
id: d4e5f6a7-b8c9-0123-defa-234567890123
status: experimental
description: >
    Detects reconnaissance commands executed as children of PHP or web server
    processes, indicative of post-exploitation activity. This is a behavioral
    TTP companion rule, not specific to any single vulnerability.
references:
    - https://unit42.paloaltonetworks.com/cve-2026-109618-cve-2026-109619/
    - https://www.huntress.com/blog/php2shell-leaked-critical-php-vulnerabilities
author: CTI Analyst
date: 2026-11-01
tags:
    - attack.t1082
    - attack.t1033
logsource:
    category: process_creation
    product: linux
detection:
    selection_parent:
        ParentImage|endswith:
            - '/php-fpm'
            - '/php-cgi'
            - '/php'
            - '/httpd'
            - '/apache2'
            - '/lsphp'
            - '/litespeed'
    selection_recon_image:
        Image|endswith:
            - '/whoami'
            - '/id'
            - '/uname'
            - '/hostname'
            - '/ifconfig'
            - '/ip'
            - '/netstat'
            - '/ss'
            - '/cat'
            - '/ls'
    selection_recon_cmdline:
        CommandLine|contains:
            - 'whoami'
            - 'uname -a'
            - '/etc/passwd'
            - 'ifconfig'
            - 'netstat'
            - 'ip addr'
    condition: selection_parent and (selection_recon_image or selection_recon_cmdline)
falsepositives:
    - Monitoring scripts executed through web applications
    - Server status pages that query system information
level: medium
