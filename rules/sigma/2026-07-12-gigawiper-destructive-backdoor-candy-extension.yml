title: GigaWiper File Encryption with Candy Extension
id: cf8d6a9b-ec7d-4daf-da1b-6c5e8b7faacd
status: experimental
description: >
    Detects file rename operations appending the .candy extension, indicating
    GigaWiper command 3 destructive encryption activity.
references:
    - https://www.microsoft.com/en-us/security/blog/2026/07/09/gigawiper-anatomy-of-a-destructive-backdoor-assembled-from-multiple-malware/
author: Actioner
date: 2026-07-12
tags:
    - attack.t1486
logsource:
    category: file_rename
    product: windows
detection:
    selection:
        TargetFilename|endswith: '.candy'
    condition: selection
falsepositives:
    - Software using .candy as a legitimate file extension is extremely rare
level: critical
