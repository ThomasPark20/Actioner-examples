title: Suspicious af-runtime-diagnostics User-Agent String
id: ca8c120c-9717-41f3-bb9c-70cab6a53336
status: experimental
description: >
    Detects HTTP requests with User-Agent strings used by the agent-framework
    credential stealer: "af-runtime-diagnostics/1" (v1.26.1) and
    "runtime-diagnostics/1" (v1.26.2).
references:
    - https://www.wiz.io/blog/malicious-version-of-microsofts-agent-framework-published-to-pypi
    - https://socket.dev/blog/agent-framework-pypi-package-compromised-with-credential-stealer
author: Actioner
date: 2026/11/22
tags:
    - attack.t1071.001
    - attack.t1567
logsource:
    category: proxy
detection:
    selection:
        c-useragent|contains:
            - 'af-runtime-diagnostics/1'
            - 'runtime-diagnostics/1'
    condition: selection
falsepositives:
    - Custom developer tools using similar naming; unlikely given the specific strings
level: high
---
title: Agent Framework Stealer Execution Guard Environment Variable
id: b1bcb13e-76fd-4fa3-829b-031e421bbe69
status: experimental
description: >
    Detects processes spawned with the _AF_TEL=1 environment variable, which the
    agent-framework credential stealer sets as a recursion guard to prevent
    re-execution. Requires EDR telemetry that captures process environment
    variables (e.g., CrowdStrike); will not fire from Sysmon or standard
    Windows event logs.
references:
    - https://www.wiz.io/blog/malicious-version-of-microsofts-agent-framework-published-to-pypi
author: Actioner
date: 2026/11/22
tags:
    - attack.t1059.006
    - attack.t1546
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        EnvironmentVariables|contains: '_AF_TEL=1'
    condition: selection
falsepositives:
    - Applications using _AF_TEL as a legitimate environment variable; very unlikely
level: medium
