title: Agent Framework Credential Exfiltration to Webhook.site
id: bdd5059b-21b7-42e0-b831-be1aa570634b
status: experimental
description: >
    Detects HTTPS POST requests to the specific webhook.site UUID endpoint used
    by the agent-framework credential stealer for data exfiltration. The rule keys
    on the full UUID path (d381fd80-ec62-42ad-8f5c-d1b15103c9bb), not just the domain.
references:
    - https://www.wiz.io/blog/malicious-version-of-microsofts-agent-framework-published-to-pypi
    - https://www.aikido.dev/blog/two-malicious-agent-framework-releases-hit-pypi-in-33-minutes
author: Actioner
date: 2026/11/22
tags:
    - attack.t1567
logsource:
    category: proxy
detection:
    selection:
        c-uri|contains: 'd381fd80-ec62-42ad-8f5c-d1b15103c9bb'
        cs-method: 'POST'
        r-dns|contains: 'webhook.site'
    condition: selection
falsepositives:
    - None known; the UUID is specific to this attack campaign
level: high
