---
title: Malicious Python PTH File From Agent Framework Supply Chain Attack
id: a5cea1e7-f8e7-4057-9eac-1f7f99085bba
status: experimental
description: >
    Detects creation of malicious .pth startup hook files associated with the
    agent-framework PyPI supply chain attack (versions 1.26.1 and 1.26.2).
    These .pth files execute the credential stealer on every Python interpreter
    startup without requiring an explicit import.
references:
    - https://www.wiz.io/blog/malicious-version-of-microsofts-agent-framework-published-to-pypi
    - https://www.aikido.dev/blog/two-malicious-agent-framework-releases-hit-pypi-in-33-minutes
author: Actioner
date: 2026/11/22
tags:
    - attack.t1195.002
    - attack.t1546
logsource:
    category: file_event
    product: linux
detection:
    selection:
        TargetFilename|contains: 'site-packages'
        TargetFilename|endswith:
            - 'agent_framework_meta.pth'
            - 'af_runtime_diag.pth'
    condition: selection
falsepositives:
    - None known; these filenames are specific to the malicious versions
level: high
