title: VOLTA Infostealer - Suspicious OpenRouter API Connection
id: b2d4e9f3-8a5c-4b0e-c7d2-3e9f6a1b4c8d
status: experimental
description: >
    Detects outbound network connections to the OpenRouter AI API from
    non-browser processes. VOLTA infostealer uses OpenRouter to send stolen
    victim data to LLMs for monetization assessment.
references:
    - https://blog.talosintelligence.com/appraisal-by-ai-model-driven-victim-prioritization-in-the-volta-infostealer/
author: Actioner CTI
date: 2026-11-07
tags:
    - attack.exfiltration
    - attack.t1567
logsource:
    category: dns_query
    product: windows
detection:
    selection:
        QueryName|endswith: 'openrouter.ai'
    filter_main_browser:
        Image|endswith:
            - '\chrome.exe'
            - '\firefox.exe'
            - '\msedge.exe'
            - '\brave.exe'
            - '\opera.exe'
    condition: selection and not filter_main_browser
falsepositives:
    - Legitimate AI-powered desktop applications using OpenRouter
    - Developer tools and IDE extensions calling OpenRouter API
level: medium
